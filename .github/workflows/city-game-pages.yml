name: Deploy Blockside to GitHub Pages
on:
  push:
    branches: [city-online-mvp]
    paths:
      - 'city-game/**'
      - '.github/workflows/city-game-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blockside-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game files
        uses: actions/upload-pages-artifact@v4
        with:
          path: city-game
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
