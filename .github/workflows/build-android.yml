name: Build Living World Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.3"

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Configure Godot templates and Android tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          if [ -d /root/.local/share/godot/export_templates/4.3.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          fi
          if [ -d /root/.config/godot ] && [ ! -d "$HOME/.config/godot" ]; then
            cp -a /root/.config/godot "$HOME/.config/godot"
          fi
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          touch "$SETTINGS"
          if grep -q 'export/android/java_sdk_path' "$SETTINGS"; then
            sed -i 's|^export/android/java_sdk_path = .*|export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"|' "$SETTINGS"
          else
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> "$SETTINGS"
          fi
          if grep -q 'export/android/android_sdk_path' "$SETTINGS"; then
            sed -i 's|^export/android/android_sdk_path = .*|export/android/android_sdk_path = "/usr/lib/android-sdk"|' "$SETTINGS"
          else
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> "$SETTINGS"
          fi
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -storetype JKS
          SDKMANAGER=/usr/lib/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          set -o pipefail
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=/usr/lib/android-sdk" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          java -version
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -d /usr/lib/android-sdk

      - name: Import project and validate main scene
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --editor --path . --import
          godot --headless --path . --quit-after 3

      - name: Export debug APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/living-world-debug.apk
          test -s build/living-world-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: living-world-android
          path: build/living-world-debug.apk
          if-no-files-found: error
